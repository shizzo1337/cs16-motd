name: Build cs16-client 3842 (32-bit) with MOTD in browser

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Keep line endings as is
        shell: bash
        run: git config --global core.autocrlf false

      - name: Get this repository (contains the patch)
        uses: actions/checkout@v4
        with:
          path: mypatch

      - name: Get cs16-client sources (commit of build 3842)
        uses: actions/checkout@v4
        with:
          repository: Velaron/cs16-client
          ref: c71cfc16e9e1d44104ee0e2c55da9ba24507f4f9
          submodules: recursive
          path: cs16

      - name: Apply MOTD patch
        shell: bash
        working-directory: cs16
        run: git apply --ignore-whitespace ../mypatch/cs16_motd_browser.patch

      - name: Setup Visual Studio (32-bit)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure
        working-directory: cs16
        run: cmake --preset win32-release-x86 -DBUILD_MAINUI=OFF -DBUILD_SERVER=OFF

      - name: Build client only
        working-directory: cs16
        run: cmake --build build --target client

      - name: Check architecture (must be 32-bit x86)
        shell: bash
        working-directory: cs16
        run: |
          found=0
          for f in $(find build -name "client*.dll"); do
            found=1
            echo "== $f"
            dumpbin -headers "$f" | grep -i "machine"
            if ! dumpbin -headers "$f" | grep -qi "14C machine (x86)"; then
              echo "ERROR: $f is NOT a 32-bit (x86) library"
              exit 1
            fi
          done
          if [ "$found" = "0" ]; then echo "ERROR: client dll was not built"; exit 1; fi

      - name: Collect result
        shell: bash
        working-directory: cs16
        run: |
          mkdir -p ../result
          find build -name "client*.dll" -exec cp -v {} ../result/ \;
          ls -la ../result

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: cs16-client-3842-motd-x86
          path: result/*
