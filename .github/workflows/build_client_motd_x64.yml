name: Build cs16-client 3979 (x64) with MOTD in the browser

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as is
        run: git config --global core.autocrlf false

      - name: Get this repository (contains the patch)
        uses: actions/checkout@v4
        with:
          path: mypatch

      - name: Get cs16-client sources (latest, build 3979)
        uses: actions/checkout@v4
        with:
          repository: Velaron/cs16-client
          ref: e30e27c3bd890f731ad7921d9c876d171aea4b32
          submodules: recursive
          path: cs16

      - name: Apply the MOTD patch
        working-directory: cs16
        run: git apply --ignore-whitespace --whitespace=nowarn ../mypatch/cs16_motd_browser_3979.patch

      - name: Setup Visual Studio (64-bit)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure
        working-directory: cs16
        run: cmake --preset win32-release-amd64 -DBUILD_MAINUI=OFF -DBUILD_SERVER=OFF

      - name: Build client only
        working-directory: cs16
        run: cmake --build build --target client

      - name: Collect result
        working-directory: cs16
        run: |
          OUT="$GITHUB_WORKSPACE/result"
          mkdir -p "$OUT/cstrike/cl_dlls"
          find build -name "client*.dll" -exec cp -v {} "$OUT/cstrike/cl_dlls/" \;
          ls -la "$OUT/cstrike/cl_dlls"

      - name: Check result (64-bit client with the MOTD patch)
        working-directory: result
        run: |
          set -eu
          f=$(ls cstrike/cl_dlls/client*.dll | head -n1)
          echo "client: $f"
          python - "$f" <<'PY'
          import struct, sys
          d = open(sys.argv[1], 'rb').read(4096)
          pe = struct.unpack_from('<I', d, 0x3c)[0]
          machine = struct.unpack_from('<H', d, pe + 4)[0]
          print('PE machine type:', hex(machine), '(0x8664 = 64-bit x64)')
          sys.exit(0 if machine == 0x8664 else 1)
          PY
          grep -aq "cl_motd_browser_iframe" "$f" || { echo "ERROR: the MOTD patch is not in this client"; exit 1; }
          grep -aq "ShellExecute" "$f" || { echo "ERROR: the client cannot open the browser"; exit 1; }
          grep -aq -- "-motd" "$f" || { echo "ERROR: the version mark -motd is missing"; exit 1; }
          echo "Result looks complete"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: cs16-client-3979-motd-x64
          path: result/*
