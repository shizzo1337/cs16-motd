name: Adapt Xash3D SteamUI patch to upstream master

on:
  push:
    branches:
      - automation/xash3d-steamui-master-adaptation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v5
        with:
          path: patch-repo

      - name: Checkout pinned upstream master
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          ref: cdcb29aa86a5ab16154622e862dd05c62b7561fc
          fetch-depth: 0
          submodules: recursive
          path: xash

      - name: Adapt patch and verify applicability
        id: adapt
        shell: bash
        run: |
          set +e
          RESULT="${GITHUB_WORKSPACE}/result"
          PATCH="${GITHUB_WORKSPACE}/patch-repo/xash3d_steamui.source.patch"
          mkdir -p "$RESULT"
          cd "${GITHUB_WORKSPACE}/xash"

          {
            echo "Upstream commit: $(git rev-parse HEAD)"
            echo "Source patch SHA256:"
            sha256sum "$PATCH"
            echo "Adaptation method: git apply --3way (without --reject)"
          } > "$RESULT/adaptation-report.txt"

          git apply --3way --whitespace=nowarn "$PATCH" > "$RESULT/apply.stdout.txt" 2> "$RESULT/apply.stderr.txt"
          APPLY_RC=$?
          echo "git apply --3way exit code: $APPLY_RC" >> "$RESULT/adaptation-report.txt"

          git status --short > "$RESULT/git-status.txt"
          git ls-files -u > "$RESULT/unmerged-index.txt"
          git diff --cc > "$RESULT/conflict-diff.txt"
          git diff --binary HEAD > "$RESULT/worktree-diff.patch"

          if [ "$APPLY_RC" -eq 0 ]; then
            cp "$RESULT/worktree-diff.patch" "$RESULT/xash3d_steamui.patch"
            git reset --hard HEAD
            git clean -fd
            git apply --check "$RESULT/xash3d_steamui.patch" > "$RESULT/check.stdout.txt" 2> "$RESULT/check.stderr.txt"
            CHECK_RC=$?
            echo "git apply --check exit code: $CHECK_RC" >> "$RESULT/adaptation-report.txt"
            if [ "$CHECK_RC" -eq 0 ]; then
              echo "RESULT=SUCCESS" >> "$RESULT/adaptation-report.txt"
              echo "success=true" >> "$GITHUB_OUTPUT"
            else
              rm -f "$RESULT/xash3d_steamui.patch"
              echo "RESULT=PATCH_CHECK_FAILED" >> "$RESULT/adaptation-report.txt"
              echo "success=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "RESULT=CONFLICTS_REQUIRE_MANUAL_RECONCILIATION" >> "$RESULT/adaptation-report.txt"
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload adapted patch and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-steamui-adaptation-${{ github.run_number }}-${{ github.run_attempt }}
          path: result/
          if-no-files-found: error

      - name: Set workflow result
        if: steps.adapt.outputs.success != 'true'
        run: |
          echo "Patch adaptation did not produce a verified patch. Inspect the uploaded diagnostics."
          exit 1
